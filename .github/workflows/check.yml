name: Validate toolkit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate shells and check bootstrap scripts
        run: nix flake check --no-update-lock-file
      - name: Realize and smoke-test every profile
        run: |
          export HOME="$(mktemp -d)"
          unset DISPLAY WAYLAND_DISPLAY
          for profile in core web ad gui full; do
            nix --extra-experimental-features 'nix-command flakes' build --no-update-lock-file --no-link ".#devShells.x86_64-linux.$profile"
            timeout 45 nix --extra-experimental-features 'nix-command flakes' develop --no-update-lock-file ".#$profile" --command bash scripts/smoke.sh "$profile"
          done
      - name: Check interactive shell entry and explicit commands
        run: python3 tests/check_nix_shell.py --flake "$PWD"
